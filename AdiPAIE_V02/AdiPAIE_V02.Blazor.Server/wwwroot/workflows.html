<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f7f4; color: #2c2c2a; }
.header { background: #1F4E79; color: #fff; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 18px; font-weight: 500; }
.header span { font-size: 12px; opacity: 0.7; }
.main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
.tab { padding: 7px 16px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1.5px solid #d0cecc; color: #5f5e5a; background: #fff; transition: all .2s; }
.tab:hover { border-color: #85b7eb; color: #185fa5; }
.tab.active { background: #e6f1fb; color: #185fa5; border-color: #85b7eb; }
.diagram { display: none; background: #fff; border-radius: 12px; border: 1px solid #e0ddd6; padding: 20px; }
.diagram.active { display: block; }
.diagram svg { width: 100%; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; font-size: 11px; color: #888; }
.leg { display: flex; align-items: center; gap: 5px; }
.leg-dot { width: 10px; height: 10px; border-radius: 50%; }
.print-btn { margin-bottom: 16px; padding: 8px 16px; background: #1F4E79; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
@media print { .tabs, .print-btn { display: none; } .diagram { display: block !important; margin-bottom: 32px; page-break-after: always; } }
</style>
</head>
