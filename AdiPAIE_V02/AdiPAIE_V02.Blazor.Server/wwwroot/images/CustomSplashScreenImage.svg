<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">

  <!-- Fond circulaire vert — clipPath pour forcer le cercle -->
  <defs>
    <clipPath id="circle-clip">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>

  <!-- Fond vert dans le cercle -->
  <circle cx="100" cy="100" r="100" fill="#0F6E56"/>

  <!-- Rayons du soleil -->
  <line x1="100" y1="14" x2="100" y2="34" stroke="#FAC775" stroke-width="5" stroke-linecap="round"/>
  <line x1="136" y1="22" x2="128" y2="38" stroke="#FAC775" stroke-width="5" stroke-linecap="round"/>
  <line x1="64"  y1="22" x2="72"  y2="38" stroke="#FAC775" stroke-width="5" stroke-linecap="round"/>
  <line x1="158" y1="50" x2="144" y2="56" stroke="#FAC775" stroke-width="5" stroke-linecap="round"/>
  <line x1="42"  y1="50" x2="56"  y2="56" stroke="#FAC775" stroke-width="5" stroke-linecap="round"/>

  <!-- Disque soleil jaune -->
  <circle cx="100" cy="112" r="56" fill="#FAC775"/>

  <!-- Silhouette salarié (tête + corps) en vert foncé -->
  <circle cx="100" cy="96" r="16" fill="#085041"/>
  <path d="M72 124 Q72 108 100 108 Q128 108 128 124 Z" fill="#085041"/>

  <!-- Texte SUNU -->
  <text x="100" y="153" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="13" font-weight="bold" fill="#085041" letter-spacing="3">SUNU</text>

  <!-- Texte PAIE -->
  <text x="100" y="167" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="11" font-weight="bold" fill="#085041" letter-spacing="4">PAIE</text>

  <!-- Pièce ₣ en bas à droite -->
  <circle cx="148" cy="152" r="22" fill="#085041" clip-path="url(#circle-clip)"/>
  <circle cx="148" cy="152" r="17" fill="none" stroke="#FAC775" stroke-width="2.5" clip-path="url(#circle-clip)"/>
  <line x1="144" y1="141" x2="144" y2="163" stroke="#FAC775" stroke-width="3" stroke-linecap="round" clip-path="url(#circle-clip)"/>
  <line x1="137" y1="148" x2="154" y2="148" stroke="#FAC775" stroke-width="3" stroke-linecap="round" clip-path="url(#circle-clip)"/>
  <line x1="137" y1="155" x2="152" y2="155" stroke="#FAC775" stroke-width="3" stroke-linecap="round" clip-path="url(#circle-clip)"/>

</svg>
